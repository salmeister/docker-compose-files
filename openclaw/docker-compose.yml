  openclaw-gateway-bf:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-bf
    labels:
      - swag=enable
      - swag_address=openclaw-bf
      - swag_port=18789
      - swag_url=bfpa.*
    environment:
      TZ: ${TZ:-America/Chicago}
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      PATH: /home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:/usr/local/bin:/usr/bin:/bin
      GOG_KEYRING_BACKEND: ${GOG_KEYRING_BACKEND}
      GOG_KEYRING_PASSWORD: ${GOG_KEYRING_PASSWORD}
      PLAYWRIGHT_BROWSERS_PATH: /home/node/.cache/ms-playwright
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY_BF}
      GOOGLE_WORKSPACE_CLI_CREDENTIALS_FILE: /home/node/.openclaw/credentials/gws-credentials.json
      VAULTWARDEN_URL: ${VAULTWARDEN_URL}
      VAULTWARDEN_EMAIL: ${VAULTWARDEN_EMAIL_BF}
      VAULTWARDEN_MASTER_PASSWORD: ${VAULTWARDEN_MASTER_PASSWORD_BF}
      BRAVE_API_KEY: ${BRAVE_API_KEY_BF}
      TAVILY_API_KEY: ${TAVILY_API_KEY_BF}
      FIRECRAWL_API_KEY: $FIRECRAWL_API_KEY_BF}
    networks:
      - shared-net
    volumes:
      - ./homebrew:/home/linuxbrew/.linuxbrew:rw
      - ./bfpa/config:/home/node/.config
      - ./bfpa/openclaw:/home/node/.openclaw
      - ./gateway-entrypoint.sh:/usr/local/bin/gateway-entrypoint.sh:ro
      - ./bfpa/.cache:/home/node/.cache
    ports:
      - "127.0.0.1:18793:18789"
      - "127.0.0.1:18794:18790"
    init: true
   #deploy:
     #resources:
      #  limits:
      #    memory: 16gb  # Cap to prevent overconsumption; adjust based on your Whisper model
      #  reservations:
      #    memory: 8gb   # Guarantee a minimum
      #   devices:
      #      - driver: nvidia
      #        count: all  # Or specify device IDs if multiple GPUs
      #       capabilities: [gpu]
    restart: unless-stopped
    user: "0:0" # Run the container as root user
    command: ["/usr/local/bin/gateway-entrypoint.sh"]

  openclaw-cli-bf:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-cli-bf
    environment:
      HOME: /home/node
      TERM: xterm-256color
      BROWSER: echo
    networks:
      - shared-net
    volumes:
      - ./homebrew:/home/linuxbrew/.linuxbrew:rw
      - ./bfpa/config:/home/node/.config
      - ./bfpa/openclaw:/home/node/.openclaw
    stdin_open: true
    tty: true
    init: true
    restart: unless-stopped
    user: "0:0" # Run the container as root user
    entrypoint: ["node", "dist/index.js"]

