services:
  obsidian:
    image: lscr.io/linuxserver/obsidian:latest
    container_name: obsidian
    labels:
      - swag=enable
      - swag_address=${SWAG_ADDRESS}
      - swag_port=3111
      - swag_url=notes.*
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1002}
      - TZ=${TZ:-America/Chicago}
    volumes:
      - ./obsidian/config:/config
    ports:
      - 3111:3000
      - 3001:3001
    networks:
      - shared-net
    shm_size: "1gb"
    restart: unless-stopped
  obsidian-livesync:
    container_name: obsidian-livesync
    image: couchdb:3.3.3
    build: .
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1002}
      - UMASK=0022
      - TZ=${TZ:-America/Chicago}
    env_file:
      - ./.env
    volumes:
      - ./data:/opt/couchdb/data
      - ./etc/local.d:/opt/couchdb/etc/local.d
      - ./log:/opt/couchdb/var/log/couchdb
    networks:
      - shared-net
    ports:
      - 127.0.0.1:5984:5984
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    labels:
      - swag=enable
      - swag_address=obsidian-livesync
      - swag_port=5984
      - swag_url=secondbrain.*

volumes:
  data:
  etc:
  log:

networks:
  shared-net:
    external: true
    name: shared-net
